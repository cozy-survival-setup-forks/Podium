name: Podium
version: '${version}'
main: dev.podium.PodiumPlugin
api-version: '1.21'
description: Leaderboard and stats menus, backed by PlaceholderAPI (works great with Topper)
authors: [Groovified]
website: https://discord.gg/blockie
softdepend:
  - PlaceholderAPI

commands:
  leaderboards:
    description: Open the leaderboards dashboard, or jump to one board
    usage: /<command> [board] [reload]
    aliases: [leaderboard, lb]
  stats:
    description: View your or another player's stats menu
    usage: /<command> [player]
  podium:
    description: Reload Podium and manage the boards that stand in the world
    usage: /<command> <reload|display|topper>
    aliases: [pod]

permissions:
  podium.leaderboards:
    description: Open the leaderboards dashboard and boards
    default: true
  podium.stats:
    description: View your own stats menu
    default: true
  podium.stats.others:
    description: View another player's stats menu
    default: op
  podium.admin:
    description: Reload Podium and put up or take down world boards
    default: op
