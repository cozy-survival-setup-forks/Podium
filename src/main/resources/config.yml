# Podium settings. Board and stat item definitions live in leaderboards.yml and stats-menu.yml.

# How often (in ticks) open menus refresh their placeholder values. 20 ticks = 1 second.
refresh-interval-ticks: 100

# The Topper plugin (https://github.com/Topper-MC) fills the boards through PlaceholderAPI. In leaderboards.yml a
# board only needs `topper: <holder>`. The holders are read from Topper's own config.yml.
topper:
  # Also make a board of every Topper holder that no board in leaderboards.yml uses yet. Holders that only exist to
  # feed a time window of another one (money_daily next to money) are not made into boards of their own.
  auto-boards: false

# Anonymous usage beacon: plugin name/version, server software/version and online/max player
# counts, nothing else. Set to false to turn it off.
metrics:
  enabled: true
  interval-minutes: 45
