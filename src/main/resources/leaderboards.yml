# The dashboard is what /leaderboards opens: a grid of every board below, plus a filter to
# switch between time periods. To add a new leaderboard, add an entry under "boards" - it
# shows up on the dashboard automatically, no slot math needed.

dashboard:
  title: "Leaderboards - <period>"
  rows: 4

  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "

  # slots the board icons are allowed to flow into, top to bottom, left to right.
  # anything left over is paginated onto a second page.
  board-slots: "[0-6, 9-16, 18-25]"

  filter:
    slot: 31
    material: HOPPER
    name: "&d&lFILTER"
    lore:
      - "&7Leaderboards"
      - ""
      - "&fCurrent Type:"
      - "<period-list>"
      - ""
      - "&e&lCLICK &fto Sort"
    period-selected: "&d> <period>"
    period-unselected: "&8- <period>"

  previous-page:
    slot: 29
    material: ARROW
    name: "&ePrevious Page"
  next-page:
    slot: 33
    material: ARROW
    name: "&eNext Page"

# Shared chrome for every board's own ranking list, so a new board only needs the entries
# under "boards" below - it doesn't have to redeclare filler/navigation/row formatting.
board-template:
  rows: 6
  title: "<board> - <period>"

  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "

  entry-slots: "[0-44]"

  entry-name: "&f#<position> <player>"
  entry-lore:
    - "&7<board>"
    - ""
    - "&fPosition: &6#<position>"
    - "&fPlayer: &6<player>"
    - "&fValue: &6<value>"
    - ""
    - "&e&lCLICK &fto View Profile"
  entry-actions:
    - "[command] stats <player>"

  back:
    slot: 49
    material: BARRIER
    name: "&cBack"
  previous-page:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
  next-page:
    slot: 50
    material: ARROW
    name: "&eNext Page"

periods:
  - id: all_time
    label: "All Time"
  - id: monthly
    label: "Monthly"
  - id: weekly
    label: "Weekly"
  - id: daily
    label: "Daily"

# Each board needs an icon, a name, a description for the dashboard tooltip, and where its numbers come from.
#
# With the Topper plugin that is one line, the name of the holder:   topper: money
# Podium reads the holders from Topper's own config.yml and checks the name when it starts. If Topper also has
# holders called <holder>_daily, <holder>_weekly or <holder>_monthly (TimedTopper makes those), the Daily, Weekly
# and Monthly buttons use them by themselves. To name them yourself:
#     topper:
#       all_time: money
#       daily: money_daily
#       monthly: money_monthly
# `value-format: "#,###"` is a Topper number format for the values.
#
# Anything else that PlaceholderAPI can give is written out, one pair for each period it has (a period a board does
# not have is not shown as a button, or falls back to all_time in the menus):
#     periods:
#       all_time:
#         name: "%some_placeholder_<position>_name%"
#         value: "%some_placeholder_<position>_value%"
#
# `display` is for the boards that stand in the world (/podium display create): the title, the head of the value
# column, a text after each value, and the text of the tab. All optional.
boards:
  money:
    icon: EMERALD
    name: "&a$ Top Money"
    category: "Money"
    description:
      - "Ranks players by the total"
      - "amount of money they have earned."
    topper: money
    display:
      value-header: "Balance"
      tab: "Balance"

  kills:
    icon: DIAMOND_SWORD
    name: "&c\u2694 Top Kills"
    category: "PvP"
    description:
      - "Ranks players by how many"
      - "other players they have killed."
    topper: kills
    display:
      value-header: "Kills"
      tab: "Kills"

  mob_kills:
    icon: ZOMBIE_HEAD
    name: "&2Top Mob Kills"
    category: "PvE"
    description:
      - "Ranks players by how many"
      - "mobs they have killed."
    topper: mob_kills
    display:
      value-header: "Mobs"
      tab: "Mob Kills"

  playtime:
    icon: CLOCK
    name: "&eTop Playtime"
    category: "Activity"
    description:
      - "Ranks players by how much"
      - "time they've spent on the server."
    topper: playtime
    display:
      value-header: "Time"
      tab: "Playtime"

  blocks_broken:
    icon: IRON_PICKAXE
    name: "&7Top Blocks Broken"
    category: "Mining"
    description:
      - "Ranks players by how many"
      - "blocks they've broken."
    topper: blocks_broken
    display:
      value-header: "Blocks"
      tab: "Mining"
